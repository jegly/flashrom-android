# Meson cross file: Android arm64-v8a, API 23, NDK r30.
#
# Replaces the on-device Termux build the original build_flashrom_custom.sh did.
# Paths are absolute because meson does not expand environment variables here;
# regenerate this file if the NDK moves.

[binaries]
c          = '/home/xxl1l10x01/Android/Sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang'
cpp        = '/home/xxl1l10x01/Android/Sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang++'
ar         = '/home/xxl1l10x01/Android/Sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
strip      = '/home/xxl1l10x01/Android/Sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
pkg-config = 'pkg-config'

[built-in options]
# Android has no versioned sonames; keep libraries unversioned.
c_args      = ['-Oz', '-fPIC', '-fstack-protector-strong', '-D_FORTIFY_SOURCE=2']
c_link_args = ['-Wl,-z,max-page-size=16384', '-Wl,-z,relro,-z,now']

[properties]
# Where our cross-built libusb / libftdi1 / libconfuse .pc files live.
pkg_config_libdir = '/home/xxl1l10x01/Documents/Flash-EEPROM-Tool/native/sysroot/data/data/com.diamon.curso/files/usr/lib/pkgconfig'

# The .pc files record the on-device prefix (/data/data/com.diamon.curso/...),
# which does not exist on this machine. sys_root makes meson set
# PKG_CONFIG_SYSROOT_DIR so -I/-L paths are rewritten to the staging tree.
sys_root = '/home/xxl1l10x01/Documents/Flash-EEPROM-Tool/native/sysroot'

[host_machine]
# 'linux', not 'android'. flashrom gates the serial programmers (serprog,
# buspirate_spi, spidriver) on a platform whitelist that does not list android,
# even though Android is Linux and the termios / devpts code they need works
# fine there -- the app's PtyBridge already drives serprog this way.
system     = 'linux'
cpu_family = 'aarch64'
cpu        = 'aarch64'
endian     = 'little'
